name: Construir y publicar imagen Docker

# Primero pasa los tests; SOLO si pasan se construye la imagen y se publica en GitHub
# Container Registry (GHCR), en cada push a main/develop y en cada tag de versión. La
# imagen queda en ghcr.io/probertoj/liderarrr con etiquetas: latest (main), develop y
# vX.Y.Z. Como un push a main publica :latest —y eso llega al NAS de cualquiera que haga
# «docker compose pull»—, la suite es la puerta: si falla, no se publica nada.
on:
  push:
    branches: [main, develop]
    tags: ['v*']
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/liderarrr

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # La misma versión de Node que lleva la imagen (node:22-slim): lo que importa es
      # que la suite pase DONDE va a correr la app, no donde se programa.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # ci y no install: respeta package-lock.json al pie de la letra.
      - run: npm ci

      # Una suite que no encuentra NINGÚN fichero termina con éxito y dejaría pasar todo:
      # eso es peor que no tener puerta. Por eso no basta con que npm test salga bien, hay
      # que ver en su salida que se ejecutó al menos un test.
      - name: Tests
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee salida-tests.txt
          grep -qE '^(#|ℹ) tests [1-9]' salida-tests.txt || {
            echo "::error::La suite no ejecutó ningún test"
            exit 1
          }

  build:
    needs: test # si la suite falla, aquí no se llega: no se publica imagen
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Login en GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Metadatos (etiquetas)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=develop,enable=${{ github.ref == 'refs/heads/develop' }}
            type=semver,pattern={{version}}
            type=sha,format=short

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      # Primero se construye SOLO en local. Nada se publica hasta que la imagen demuestre
      # que arranca, porque un fallo aquí llega al NAS de la gente con el siguiente pull.
      - name: Construir (local, para probarla)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: liderarrr:humo
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Caso de siempre: sin PUID el contenedor sigue siendo root. Está aquí porque es lo
      # que tiene todo el mundo instalado, y lo que NO debe cambiar nunca sin querer.
      - name: Humo — arranca como root
        shell: bash
        run: |
          set -eo pipefail
          mkdir -p /tmp/humo-root
          docker run -d --name humo-root -p 3861:3861 -v /tmp/humo-root:/data liderarrr:humo
          for i in $(seq 1 45); do curl -fsS localhost:3861/api/version >/dev/null && break; sleep 2; done
          docker logs humo-root
          curl -fsS localhost:3861/api/version
          uid=$(docker exec humo-root stat -c %u /proc/1)
          [ "$uid" = "0" ] || { echo "::error::sin PUID debería seguir siendo root, y corre como uid=$uid"; exit 1; }
          docker rm -f humo-root

      # Y el salto de privilegios: que la app acabe corriendo como ese usuario y que la base
      # de datos nazca siendo suya. Es lo único que no se puede comprobar sin un contenedor.
      - name: Humo — con PUID/PGID corre sin privilegios
        shell: bash
        run: |
          set -eo pipefail
          # La carpeta tiene que ser DE ese usuario, que es justo lo que se le pide a la
          # gente en el README. El runner de GitHub no es el uid 1000, así que sin este
          # chown se dispara la red de seguridad del entrypoint y la app sigue como root.
          echo "runner: $(id)"
          mkdir -p /tmp/humo-puid
          sudo chown 1000:1000 /tmp/humo-puid
          ls -ldn /tmp/humo-puid
          docker run -d --name humo-puid -p 3862:3861 -e PUID=1000 -e PGID=1000 \
            -v /tmp/humo-puid:/data liderarrr:humo
          for i in $(seq 1 45); do curl -fsS localhost:3862/api/version >/dev/null && break; sleep 2; done
          docker logs humo-puid
          curl -fsS localhost:3862/api/version
          uid=$(docker exec humo-puid stat -c %u /proc/1)
          [ "$uid" = "1000" ] || { echo "::error::la app corre como uid=$uid, no como 1000"; exit 1; }
          docker logs humo-puid 2>&1 | grep -q "Sin privilegios" || { echo "::error::no dijo que soltaba privilegios"; exit 1; }
          dueno=$(stat -c %u /tmp/humo-puid/liderarrr.db)
          [ "$dueno" = "1000" ] || { echo "::error::la base la creó el uid $dueno"; exit 1; }
          docker rm -f humo-puid

      - name: Publicar
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
