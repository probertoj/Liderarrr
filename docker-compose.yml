services:
  liderarrr:
    image: ghcr.io/probertoj/liderarrr:latest
    # Para construir localmente en vez de usar la imagen publicada:
    # build: .
    container_name: liderarrr
    restart: unless-stopped
    ports:
      - '3861:3861'
    volumes:
      # RECOMENDADO (estructura TRaSH Guides): monta tu carpeta «data» —con torrents/ y
      # media/ dentro— en /data, y MONTA ESA MISMA CARPETA CON EL MISMO PATH (/data) EN
      # qBittorrent. Así qBittorrent reporta /data/torrents/music/... y Liderarr ve
      # exactamente esa ruta → los hardlinks funcionan y el auto-import va solo.
      # La BD de Liderarr vive dentro, en /data/liderarrr.db.
      #   estructura:  data/torrents/music  (descargas)   +   data/media/music  (biblioteca)
      #   en Ajustes:  Carpeta de descargas = /data/torrents/music
      #                Carpeta de biblioteca = /data/media/music
      #   https://trash-guides.info/File-and-Folder-Structure/
      - /ruta/a/tu/data:/data
      #
      # ALTERNATIVA MÍNIMA (solo catalogar, SIN importar/hardlink): BD aparte y tu música
      # en solo lectura. Con esto NO funciona el auto-import (necesita torrents+media juntos).
      #   - ./config:/data
      #   - /ruta/a/tu/musica:/data/media/music:ro
    environment:
      - TZ=Europe/Madrid
      # Para que la app NO corra como root: los números de TU usuario (los que te da
      # «id» en el NAS). La carpeta que montas arriba tiene que ser suya. Si con esos
      # números no pudiera escribir en /data, el contenedor sigue como root y te lo
      # dice en el log en vez de arrancar sin base de datos.
      # - PUID=1000
      # - PGID=1000
      # Cifra las credenciales en disco (recomendado):
      # - LIDERARRR_SECRET=una-frase-larga-y-secreta
      # Autenticación básica si esto no está solo en tu red de casa:
      # - LIDERARRR_AUTH=usuario:contraseña
